<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AMER AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- القائمة الجانبية -->
    <aside class="sidebar" id="sidebar">

        <div class="brand">
            <div class="brand-logo">A</div>

            <div>
                <h2>AMER AI</h2>
                <span>ذكاء يفهمك</span>
            </div>
        </div>

        <button class="new-chat" id="newChat">
            <span>＋</span>
            محادثة جديدة
        </button>

        <div class="sidebar-title">
            المحادثات
        </div>

        <div class="chat-history" id="chatHistory">
            <!-- المحادثات ستظهر هنا -->
        </div>

        <div class="sidebar-bottom">

            <button class="side-button" id="themeButton">
                🌙
                <span>الوضع الليلي</span>
            </button>

            <button class="side-button">
                ⚙️
                <span>الإعدادات</span>
            </button>

        </div>

    </aside>


    <!-- المحتوى الرئيسي -->
    <main class="main">

        <!-- الهيدر -->
        <header class="header">

            <button class="menu-button" id="menuButton">
                ☰
            </button>

            <div class="header-brand">
                <strong>AMER AI</strong>
                <span>المساعد الذكي</span>
            </div>

            <button class="clear-button" id="clearButton">
                🗑️
            </button>

        </header>


        <!-- منطقة المحادثة -->
        <section class="chat-container" id="chatContainer">

            <!-- شاشة الترحيب -->
            <div class="welcome" id="welcome">

                <div class="welcome-logo">
                    A
                </div>

                <h1>مرحبًا بك في <span>AMER AI</span> 👋</h1>

                <p>
                    أنا مساعدك الذكي. اسألني عن أي شيء
                    وسأحاول مساعدتك بأفضل طريقة ممكنة.
                </p>

                <div class="suggestions">

                    <button class="suggestion">
                        💡 اشرح لي فكرة بطريقة بسيطة
                    </button>

                    <button class="suggestion">
                        💻 ساعدني في كتابة كود
                    </button>

                    <button class="suggestion">
                        ✍️ اكتب لي موضوعًا
                    </button>

                    <button class="suggestion">
                        🧠 اختبر معلوماتي
                    </button>

                </div>

            </div>

            <!-- الرسائل -->
            <div class="messages" id="messages"></div>

        </section>


        <!-- منطقة الكتابة -->
        <div class="input-area">

            <div class="input-box">

                <button class="attach-button" title="إرفاق ملف">
                    ＋
                </button>

                <textarea
                    id="messageInput"
                    placeholder="اكتب رسالتك إلى AMER AI..."
                    rows="1"
                ></textarea>

                <button class="send-button" id="sendButton">
                    ➤
                </button>

            </div>

            <div class="input-note">
                AMER AI قد يخطئ أحيانًا، لذلك راجع المعلومات المهمة.
            </div>

        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
